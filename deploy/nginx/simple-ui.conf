# Nginx reverse proxy for simple_ui (the Flask front-desk app).
#
# simple_ui's gunicorn process listens on 127.0.0.1:5050 only (see
# deploy/systemd/simple-ui.service) — deliberately not exposed directly, so
# this proxy is the only way to reach it from outside the VM.
#
# Serves app.thestfrancishospital.com — confirmed working first as plain
# HTTP via the VM's bare IP (Nov 2026), now pointed at the real subdomain.
# admin.thestfrancishospital.com (deploy/nginx/gnuhealth.conf) handles
# Sao/GNU Health on the same VM, same port 80, different server_name —
# Nginx picks the right block by the Host header, so both can coexist.
#
# Install:
#   sudo cp deploy/nginx/simple-ui.conf /etc/nginx/sites-available/simple-ui
#   sudo ln -s /etc/nginx/sites-available/simple-ui /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.thestfrancishospital.com   # adds the TLS server block for you

server {
    listen 80;
    listen [::]:80;
    server_name app.thestfrancishospital.com;

    # Let certbot's HTTP-01 challenge through; certbot --nginx will add the
    # HTTPS server block and redirect automatically on first run.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        client_max_body_size 5m;
    }

    # Basic hardening
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
