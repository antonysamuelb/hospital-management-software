# Nginx reverse proxy for simple_ui (the Flask front-desk app).
#
# simple_ui's gunicorn process listens on 127.0.0.1:5050 only (see
# deploy/systemd/simple-ui.service) — deliberately not exposed directly, so
# this proxy is the only way to reach it from outside the VM.
#
# This version serves plain HTTP via the VM's IP address directly, no
# domain name yet (confirmed working this way against the real VM, Nov
# 2026). Once a real domain exists, replace "server_name _;" below with
# the actual app.yourdomain.example hostname (see CLOUD_DEPLOYMENT.md's
# two-subdomain plan) and run certbot the same way as
# deploy/nginx/gnuhealth.conf does for the admin/Sao side.
#
# Install:
#   sudo cp deploy/nginx/simple-ui.conf /etc/nginx/sites-available/simple-ui
#   sudo ln -s /etc/nginx/sites-available/simple-ui /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# "default_server" below means this block answers ANY request to this VM
# on port 80 that doesn't match some other server_name — fine for now
# since there's only one site on this VM's port 80. If gnuhealth.conf is
# ever installed alongside this (e.g. once a domain exists and both
# subdomains are live), drop "default_server" from one of them — only one
# server block per listen directive may claim it.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        client_max_body_size 5m;
    }

    # Basic hardening
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
