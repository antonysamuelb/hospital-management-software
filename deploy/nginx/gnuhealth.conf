# Nginx reverse proxy for GNU Health HIS.
#
# GNU Health's trytond web server listens on 127.0.0.1:8000 by default
# (see /opt/gnuhealth/his-50/etc/trytond.conf, [web] listen = 0.0.0.0:8000 —
# bind it to 127.0.0.1 instead once this proxy is in front of it, so the
# app is not reachable directly from the internet).
#
# Install:
#   sudo cp deploy/nginx/gnuhealth.conf /etc/nginx/sites-available/gnuhealth
#   sudo ln -s /etc/nginx/sites-available/gnuhealth /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d your-domain.example   # adds the TLS server block for you
#
# Replace your-domain.example below before use.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;

    # Let certbot's HTTP-01 challenge through; certbot --nginx will add the
    # HTTPS server block and redirect automatically on first run.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tryton's web client keeps long-lived connections open.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        client_max_body_size 20m;
    }

    # Basic hardening
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
