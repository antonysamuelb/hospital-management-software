name: gnuhealth-dev-test

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: gnuhealth
      POSTGRES_PASSWORD: gnuhealth_dev_only
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gnuhealth"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - gnuhealth-dev-db:/var/lib/postgresql/data

  app:
    build:
      # Context is the repo root (not ./app) so the Dockerfile can also
      # reach custom_modules/ at the repo root — needed for the site
      # customization module (default ethnicity). See its COPY line below.
      context: ../..
      dockerfile: deploy/dev/app/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: gnuhealth
      PGPASSWORD: gnuhealth_dev_only
      GNUHEALTH_DATABASE: gnuhealth_test
      GNUHEALTH_ADMIN_EMAIL: admin@example.test
      GNUHEALTH_ADMIN_PASSWORD: change_me_dev_only
    ports:
      - "8000:8000"
    volumes:
      - gnuhealth-dev-attach:/opt/gnuhealth/attach

volumes:
  gnuhealth-dev-db:
  gnuhealth-dev-attach:
